# Home -> team: the games bottom sheet shows a Close button, the centred team name and the games table,
# loads older seasons on scroll, and closes via Close or system back.
appId: com.voidx.nba
name: home_game_sheet
tags:
  - smoke
  - network
  - home
  - game
---
- runFlow: common/cooldown.yaml
- runFlow: common/launch_home.yaml

- tapOn: "Boston Celtics"
- extendedWaitUntil:
    visible: "Close"
    timeout: 10000
- runFlow:
    file: common/await_content.yaml
    env:
      CONTENT: "Visitor Name"
# The title is the only "Boston Celtics" above the column headers (rows repeat the name below them).
- assertVisible:
    text: "Boston Celtics"
    above:
      text: "Visitor Name"
    rightOf:
      text: "Close"
- assertVisible: "Home Score"
- assertVisible: "Visitor Score"
- assertVisible:
    text: "Home Name"
    leftOf:
      text: "Visitor Name"

# Endless scroll: early in a season the current season can't fill the sheet, so the previous season usually
# loads on open; these swipes reach its end and may fetch one more season (1–2 requests).
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 25%
          duration: 300
- assertNotVisible: "Too many requests.*"
- assertNotVisible: "Something went wrong.*"
- assertNotVisible: "No games found for this team."
- assertVisible: "Boston Celtics"
- assertVisible: "Close"

# Close with the header button.
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 5000
- assertVisible: "Atlanta Hawks"
- assertVisible: "Players"

# Reopen and close with system back.
- tapOn: "Boston Celtics"
- runFlow:
    file: common/await_content.yaml
    env:
      CONTENT: "Visitor Name"
- assertVisible: "Close"
- back
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 5000
- assertVisible: "Atlanta Hawks"
